name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build --s

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/html

      # On pushes without a PR, comment the overall coverage on the commit
      - name: Comment coverage on commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            if (prs.some(pr => pr.state === 'open')) {
              core.info('Commit belongs to an open PR; coverage is reported there.');
              return;
            }
            const xml = require('fs').readFileSync('build/reports/kover/report.xml', 'utf8');
            // The last LINE counter in the file is the report-wide total
            const [, missed, covered] = [...xml.matchAll(/<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/g)].pop();
            const total = Number(missed) + Number(covered);
            const pct = total === 0 ? 100 : (Number(covered) / total) * 100;
            const icon = pct >= 80 ? ':white_check_mark:' : ':x:';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitComment({
              owner, repo, commit_sha: context.sha,
              body: `### Code Coverage\n\n| Total Project Coverage | ${pct.toFixed(2)}% ${icon} |\n|:-|:-:|\n\n${covered}/${total} lines covered (minimum 80%). [Full report](${runUrl})`,
            });

      # Comments (and keeps updating the comment) on PRs
      - name: Add coverage report
        id: kover
        if: github.event_name == 'pull_request'
        uses: mi-kas/kover-report@v1.9
        with:
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          coverage-counter-type: LINE
